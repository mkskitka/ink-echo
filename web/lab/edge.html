<!doctype html><meta charset="utf-8"><body style="margin:0;background:#efe6d2">
<canvas id="c" style="width:600px;height:600px"></canvas>
<script type="module">
import { pictureEdge } from "../shared/view.js";
const img = new Image(); img.src = "../hi/39545.jpg";
await img.decode();
const c = document.getElementById("c"); c.width = c.height = 1200;
const g = c.getContext("2d");
const k = 1200 / img.naturalWidth * 1.6;
const M = [k / 2, 0, 0, k / 2, -150, 80];
g.setTransform(2 * M[0], 0, 0, 2 * M[3], 2 * M[4], 2 * M[5]);
g.drawImage(img, 0, 0);
pictureEdge(g, { box: null }, img, M, [2, 0, 0]);
window.done = true;
</script>
