<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f3eee3">
  <link rel="icon" type="image/png" href="../icon-180.png">
  <link rel="apple-touch-icon" href="../icon-180.png">
  <title>Ink Echo · Collage</title>
  <link rel="stylesheet" href="../shared/base.css">
  <style>
    #collage { mix-blend-mode: multiply; }
    .sources {
      position: fixed; left: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px); z-index: 4;
      display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100vw - 20px);
    }
    .sources a {
      font-size: 12px; color: var(--ink); text-decoration: none; background: var(--chip-strong);
      border-radius: 999px; padding: 6px 10px; border-left: 4px solid var(--c, var(--seal));
      max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sources a.focus { outline: 2px solid var(--seal); }
  </style>
</head>
<body>
  <div class="stage">
    <canvas class="layer" id="collage"></canvas>
    <canvas class="pad" id="pad"></canvas>
  </div>
  <div class="badge"><b>Collage</b>One stroke, one painting</div>
  <nav class="toolbar">
    <a href="../">Versions</a>
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
    <button id="lines" aria-pressed="true">Lines</button>
  </nav>
  <div class="hint" id="hint">
    <p class="title">Collage</p>
    <p>Each stroke is matched on its own and opens a window onto a different painting, where the painter made that same gesture.</p>
    <p>Tap a fragment to see where it comes from.</p>
    <p class="sub" id="status">Loading…</p>
  </div>
  <div class="sources" id="sources"></div>
  <div class="busy" id="busy"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
